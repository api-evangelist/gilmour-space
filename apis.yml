description: Gilmour Space Technologies is an Australian venture-backed space company headquartered on
  the Gold Coast in Queensland, founded in 2012 by brothers Adam and James Gilmour. The company designs
  and manufactures hybrid-propulsion orbital launch vehicles (the Eris rocket) and satellite platforms
  (the G-class / ElaraSat bus), and operates the Bowen Orbital Spaceport in North Queensland from which
  it is pursuing Australia's first sovereign orbital launch. Gilmour Space is backed by investors
  including Blackbird Ventures, Main Sequence Ventures, 500 Global, Fine Structure Ventures and HESTA.
  It is added to the API Evangelist network as a company profile; the company operates in aerospace and
  space launch and does not currently publish a public developer API surface.
